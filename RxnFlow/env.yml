name: rxnflow
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - --find-links https://data.pyg.org/whl/torch-2.5.1+cpu.html
      - torch==2.5.1
      - torch-scatter>=2.1.2
      - torch-sparse>=0.6.18
      - torch-cluster>=1.6.3
      - -e .[pmnet]
      - gdown
      - tqdm
